
# Azure DevOps Pipeline for WinForms .NET 8 (Option B)
# - Builds Release and publishes artifacts

trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8.x SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - task: PowerShell@2
      displayName: 'Restore'
      inputs:
        targetType: 'inline'
        script: |
          dotnet restore src/HRWinFormsApp/HRWinFormsApp.csproj

    - task: PowerShell@2
      displayName: 'Build (Release)'
      inputs:
        targetType: 'inline'
        script: |
          dotnet build src/HRWinFormsApp/HRWinFormsApp.csproj --configuration $(buildConfiguration) --no-restore

    - task: PowerShell@2
      displayName: 'Publish (framework-dependent)'
      inputs:
        targetType: 'inline'
        script: |
          dotnet publish src/HRWinFormsApp/HRWinFormsApp.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/framework_dependent

    - task: PowerShell@2
      displayName: 'Publish (self-contained, single-file, win-x64)'
      inputs:
        targetType: 'inline'
        script: |
          dotnet publish src/HRWinFormsApp/HRWinFormsApp.csproj --configuration $(buildConfiguration) --runtime win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true --output $(Build.ArtifactStagingDirectory)/self_contained_win_x64

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
